<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#123c35">
<title>麻雀点数計算</title>
<style>
:root{color-scheme:dark;--bg:#0d211e;--panel:#17332e;--line:#31574f;--text:#f2f7f3;--muted:#b6c9c1;--green:#b8f078;--gold:#f6d879;--red:#ff9b8f}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#214a40 0,#0d211e 60%);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:var(--text);min-height:100vh}main{max-width:650px;margin:auto;padding:22px 16px 40px}.brand{font-size:12px;letter-spacing:.16em;color:var(--green);font-weight:800}.title{font-size:30px;line-height:1.2;margin:8px 0}.sub{color:var(--muted);font-size:14px;line-height:1.65}.panel{background:rgba(23,51,46,.94);border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:16px;box-shadow:0 12px 30px #0002}.microw{display:flex;align-items:center;gap:16px}.mic{width:82px;height:82px;border:0;border-radius:50%;background:var(--green);color:#143329;font-size:30px;box-shadow:0 0 0 7px #b8f07822;flex-shrink:0}.mic.listening{background:var(--gold);animation:pulse 1s infinite}@keyframes pulse{50%{box-shadow:0 0 0 15px #f6d87912}}.status{font-weight:700;font-size:16px}.hint{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.5}button,select,input{font:inherit}button{cursor:pointer}.smallbtn{border:1px solid var(--line);background:#24483f;color:var(--text);border-radius:12px;padding:10px 12px}.label{display:block;color:var(--muted);font-size:12px;margin:0 0 7px;font-weight:700}.transcript{font-size:16px;line-height:1.6;min-height:28px;overflow-wrap:anywhere}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:15px}.field select,.field input{width:100%;background:#0e2823;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px}.actions{display:flex;gap:10px;margin-top:14px}.primary{background:var(--green);color:#173329;border:0;border-radius:12px;padding:13px 15px;font-weight:800;flex:1}.result{border:1px solid #4e795c;background:linear-gradient(145deg,#203f32,#172e29)}.result h2{font-size:13px;color:var(--green);margin:0 0 8px}.big{font-size:36px;font-weight:900;letter-spacing:-.04em}.detail{color:var(--muted);font-size:14px;line-height:1.75;margin-top:7px}.split{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.split>div{background:#102720;border-radius:12px;padding:12px}.split strong{display:block;font-size:20px;margin-top:5px}.mini{font-size:11px;color:var(--muted)}.examples{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.examples button{font-size:12px}.foot{font-size:11px;color:var(--muted);line-height:1.7;margin:15px 2px}.error{color:var(--red);font-size:13px;margin-top:10px} @media(max-width:380px){.title{font-size:26px}.big{font-size:30px}.mic{width:70px;height:70px}}
</style></head>
<body><main>
<div class="brand">RIICHI MAHJONG · SCORE</div><h1 class="title">麻雀点数計算</h1><p class="sub">親・子、ロン・ツモ、翻数、符を選択して点数を計算します。</p><section class="panel"><h2 style="margin:0 0 14px;font-size:17px">計算内容（必要なら修正）</h2><div class="fields"><label class="field"><span class="label">和了者</span><select id="seat"><option value="child">子</option><option value="dealer">親</option></select></label><label class="field"><span class="label">和了方法</span><select id="method"><option value="ron">ロン</option><option value="tsumo">ツモ</option></select></label><label class="field"><span class="label">翻数（役＋ドラ）</span><input id="han" type="number" min="1" max="30" value="3"></label><label class="field"><span class="label">符</span><select id="fu"><option>20</option><option selected>30</option><option>40</option><option>50</option><option>60</option><option>70</option><option>80</option><option>90</option><option>100</option><option>110</option></select></label></div><div class="actions"><button class="primary" id="calc">点数を計算</button></div></section>
<section class="panel result" id="result"><h2>計算結果</h2><div class="big" id="score">3,900点</div><div class="detail" id="summary">子・ロン／3翻30符</div><div class="split"><div><span class="mini">ロンの支払点</span><strong id="ronPay">3,900点</strong></div><div><span class="mini">ツモの支払点</span><strong id="tsumoPay">1,000 / 500点</strong></div></div><div class="detail" id="explain">※本場・供託リーチ棒は含みません。</div></section>
<p class="foot">点数は一般的な四人打ちリーチ麻雀の基本点です。本場・供託・ローカルルールは含みません。符は手牌構成で変わるため、符欄を確認してから計算してください。</p>
</main><script>
const $=id=>document.getElementById(id);
function ceil100(n){return Math.ceil(n/100)*100}
function scoreCalc(){let seat=$('seat').value,method=$('method').value,han=Math.max(1,Math.min(30,parseInt($('han').value)||1)),fu=parseInt($('fu').value)||30;let base=fu*Math.pow(2,han+2),limit='';if(han>=13||base>=8000){base=8000;limit=han>=13?'役満相当': '三倍満以上';}else if(han>=11||base>=6000){base=6000;limit='三倍満';}else if(han>=8||base>=4000){base=4000;limit='倍満';}else if(han>=6||base>=3000){base=3000;limit='跳満';}else if(han>=5||base>=2000){base=2000;limit='満貫';}
// For capped values, choose correct fixed base point. At 5 han or base 2000, cap is mangan.
const dealer=seat==='dealer';let ron=ceil100(base*(dealer?6:4));let dealerPay=ceil100(base*2),childPay=ceil100(base);let tsumoText=dealer?`${dealerPay.toLocaleString()}点ずつ`:`親 ${dealerPay.toLocaleString()}点・子 ${childPay.toLocaleString()}点ずつ`;let selected=method==='ron'?ron: (dealer?dealerPay*3:dealerPay+childPay*2);let label=method==='ron'?`${ron.toLocaleString()}点`:`合計 ${selected.toLocaleString()}点`;let summary=`${dealer?'親':'子'}・${method==='ron'?'ロン':'ツモ'}／${han}翻${fu}符${limit?'・'+limit:''}`;
$('score').textContent=label;$('summary').textContent=summary;$('ronPay').textContent=ron.toLocaleString()+'点';$('tsumoPay').textContent=tsumoText;$('explain').textContent=method==='ron'?'ロン：和了者以外の1人が支払います。本場・供託リーチ棒は含みません。':`ツモ：${dealer?'子3人が各'+dealerPay.toLocaleString()+'点':'親が'+dealerPay.toLocaleString()+'点、子2人が各'+childPay.toLocaleString()+'点'}。本場・供託リーチ棒は含みません。`;
return label;}
$('calc').addEventListener('click',scoreCalc);
document.querySelectorAll('[data-example]').forEach(b=>b.addEventListener('click',()=>parseSpeech(b.dataset.example)));
scoreCalc();
</script></body></html>
